<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07070c"><title>Pinvi</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:grid;place-items:center;font-family:Inter,system-ui,sans-serif;color:#fff;background:radial-gradient(circle at 50% 0,#29234b,#0c0b14 42%,#07070c 78%);overflow:auto}.card{width:100%;max-width:430px;padding:clamp(24px,7vw,42px);border:1px solid #ffffff18;border-radius:32px;background:#ffffff0b;backdrop-filter:blur(24px);box-shadow:0 24px 90px #0009;text-align:center}.logo{width:68px;height:68px;margin:0 auto 18px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(145deg,#9b7cff,#5d42d8);box-shadow:0 14px 35px #7056e644;font-size:30px}h1{font-size:clamp(25px,7vw,32px);margin:0 0 8px}.sub{margin:0 0 25px;color:#aaa8b8;font-size:14px}.dots{display:flex;justify-content:center;gap:clamp(12px,4vw,18px);margin-bottom:12px}.dot{width:13px;height:13px;border:2px solid #696675;border-radius:50%;transition:.18s}.dot.on{background:#fff;border-color:#fff;box-shadow:0 0 15px #fff8}.msg{height:20px;margin-bottom:14px;font-size:13px;color:#ff7085}.msg.ok{color:#62e8a0}.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,2.5vw,13px)}button{width:100%;height:clamp(56px,15vw,68px);border:1px solid #ffffff12;border-radius:19px;background:#ffffff0b;color:#fff;font:600 clamp(18px,5vw,22px)/1 system-ui;touch-action:manipulation;cursor:pointer}button:active{transform:scale(.94);background:#ffffff19}.muted{font-size:12px;color:#ff7387}.green{font-size:12px;color:#6ff0aa}.shake{animation:shake .3s}.success{animation:pop .4s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}@keyframes pop{50%{transform:scale(1.035)}}@media(max-height:650px){.card{padding:20px 22px}.logo{width:52px;height:52px;margin-bottom:10px}.sub{margin-bottom:13px}.pad{gap:7px}button{height:49px}.dots{margin-bottom:7px}.msg{margin-bottom:7px}}
</style></head><body><main class="card" id="card"><div class="logo" id="icon">🔐</div><h1 id="title">Enter PIN</h1><p class="sub">Enter your 6-digit security PIN</p><div class="dots" id="dots"></div><div class="msg" id="msg"></div><section class="pad" aria-label="PIN keypad"><button onclick="press(1)">1</button><button onclick="press(2)">2</button><button onclick="press(3)">3</button><button onclick="press(4)">4</button><button onclick="press(5)">5</button><button onclick="press(6)">6</button><button onclick="press(7)">7</button><button onclick="press(8)">8</button><button onclick="press(9)">9</button><button class="muted" onclick="clearPin()">CLEAR</button><button onclick="press(0)">0</button><button class="green" onclick="verify()">ENTER</button></section></main><script>
let pin="";const dots=document.getElementById("dots"),msg=document.getElementById("msg"),card=document.getElementById("card");for(let i=0;i<6;i++){const d=document.createElement("span");d.className="dot";dots.appendChild(d)}function render(){[...dots.children].forEach((d,i)=>d.classList.toggle("on",i<pin.length))}function press(n){if(pin.length<6){pin+=n;render();if(pin.length===6)setTimeout(verify,120)}}function clearPin(){pin="";msg.textContent="";msg.className="msg";render()}async function verify(){if(pin.length!==6){msg.textContent="Enter 6 digits";return}msg.textContent="Checking…";try{const r=await fetch("/api/verify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pin})});const data=await r.json();if(r.ok&&data.ok){msg.textContent="Access granted";msg.className="msg ok";document.getElementById("title").textContent="Unlocked";document.getElementById("icon").textContent="🔓";card.classList.add("success")}else{msg.textContent=data.message||"Incorrect PIN";card.classList.remove("shake");void card.offsetWidth;card.classList.add("shake");setTimeout(clearPin,450)}}catch(e){msg.textContent="Server unavailable";setTimeout(clearPin,700)}}render();
</script></body></html>
